<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grim Gardener Farm Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Grenze+Gotisch:wght@600;800&display=swap" rel="stylesheet">
<style>
:root {
  /* Night field journal: moss-black night behind aged parchment panels, brown-ink outlines, lantern-gold actions.
     Layout: brand + day ribbon on top, then seed pouch | farm board side by side; one column on phones. */
  --night: #1c211a;
  --paper: #dccfa8;
  --paper-lo: #c7b588;
  --ink: #2a2117;
  --lantern: #e2a23a;
  --good: #b9cc8e;
  --warn: #ecc77a;
  --bad: #dea08f;
  --formula: #3f8f9e;
  --compost: #6b8e3a;
  --manure: #7a5230;
  --autumn: #c97336;
  --winter: #86afcb;
  --spring: #82ad5a;
  --summer: #ddb04e;
  --font-display: "Grenze Gotisch", "Palatino Linotype", Georgia, serif;
  --font-body: "Alegreya Sans", "Gill Sans", "Trebuchet MS", sans-serif;
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .16 0 0 0 0 .11 0 0 0 0 .06 0 0 0 .11 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100%;
  background:
    radial-gradient(1100px 520px at 12% -12%, #38412d 0%, transparent 62%),
    radial-gradient(800px 640px at 108% 24%, #262c35 0%, transparent 58%),
    var(--night);
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
}
button, input { font-family: inherit; }
:focus-visible { outline: 3px solid var(--lantern); outline-offset: 2px; }
input[type=number] { -moz-appearance: textfield; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.ic { display: block; }
img.pic { object-fit: contain; -webkit-user-drag: none; }

/* ---------- top ---------- */
.top {
  max-width: 1240px; margin: 0 auto; padding: 22px 16px 8px;
  display: grid; gap: 16px; grid-template-columns: minmax(250px, .8fr) minmax(320px, 1.7fr); align-items: center;
}
.brand { display: flex; gap: 14px; align-items: center; }
.brand .sprout { width: 70px; height: 70px; flex: none; }
.brand h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(38px, 5vw, 58px); line-height: .92;
  margin: 0; color: #efe4c4; text-shadow: 3px 3px 0 rgba(0,0,0,.6); text-wrap: balance;
}
.brand p { margin: 8px 0 0; color: #cdbf98; max-width: 36ch; }

/* ---------- panels ---------- */
.panel {
  position: relative;
  background: var(--grain), radial-gradient(120% 90% at 28% 12%, #e9dfbd 0%, var(--paper) 46%, var(--paper-lo) 100%);
  color: var(--ink);
  border: 2px solid var(--ink);
  border-radius: 9px 13px 10px 15px / 13px 9px 15px 10px;
  box-shadow: inset 0 0 0 4px rgba(255,248,225,.22), inset 0 0 28px rgba(92,62,22,.38), 4px 5px 0 rgba(0,0,0,.45);
  padding: 16px 18px 18px;
}
.panel h2 { font-family: var(--font-display); font-weight: 800; font-size: 29px; line-height: 1; margin: 0; text-wrap: balance; }
.panel h3 { font-family: var(--font-display); font-weight: 600; font-size: 22px; line-height: 1.1; margin: 22px 0 8px; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { margin: 6px 0 0; font-size: 14.5px; color: #5b4a31; }
.muted { color: #5b4a31; }

.layout {
  max-width: 1240px; margin: 0 auto; padding: 8px 16px 24px;
  display: grid; gap: 16px; grid-template-columns: minmax(300px, .92fr) minmax(340px, 1.25fr); align-items: start;
}

/* ---------- controls ---------- */
.lbl { font-weight: 700; font-size: 14.5px; }
.lbl small { font-weight: 500; color: #5b4a31; }
.field { display: grid; gap: 6px; align-content: start; }
.row { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.stepper { display: inline-flex; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; background: #f4ebd3; height: 40px; }
.stepper button { width: 38px; border: 0; background: #b78c54; color: var(--ink); font-weight: 800; font-size: 20px; cursor: pointer; }
.stepper button:hover { background: #c79b60; }
.stepper input { width: 58px; border: 0; text-align: center; font-weight: 800; font-size: 19px; background: transparent; color: var(--ink); font-variant-numeric: tabular-nums; }
.text-in { width: 92px; height: 40px; border: 2px solid var(--ink); border-radius: 10px; background: #f4ebd3; color: var(--ink); font-weight: 700; font-size: 17px; padding: 0 10px; }
.btn {
  border: 2px solid var(--ink); border-radius: 10px; background: linear-gradient(#a57a45, #82592c); color: #f5ead0;
  font-weight: 700; font-size: 14.5px; padding: 6px 12px; cursor: pointer; box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 2px 0 #3d2a14;
}
.btn:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.25); }

/* ---------- day panel ---------- */
.seasons { display: flex; gap: 6px; flex-wrap: wrap; }
.season-btn {
  display: grid; justify-items: center; gap: 2px; width: 72px; padding: 6px 4px 4px;
  border: 2px solid var(--ink); border-radius: 11px; background: rgba(255,250,232,.55);
  font-weight: 700; font-size: 13.5px; color: var(--ink); cursor: pointer;
}
.season-btn .ic { width: 30px; height: 30px; }
.season-btn[aria-checked="true"] { background: var(--ink); color: #f3e7c6; box-shadow: 0 0 0 3px var(--lantern); }
.ribbon { position: relative; display: flex; margin: 34px 0 6px; height: 44px; border: 2px solid var(--ink); border-radius: 10px; }
.seg { display: flex; align-items: center; gap: 6px; padding: 0 8px; min-width: 0; overflow: hidden; white-space: nowrap; color: #1f1910; font-weight: 700; font-size: 13.5px; }
.seg .ic { width: 22px; height: 22px; flex: none; }
.seg small { font-weight: 500; }
.seg + .seg { border-left: 2px solid var(--ink); }
.seg:first-child { border-radius: 8px 0 0 8px; }
.seg:last-child { border-radius: 0 8px 8px 0; }
.s-autumn { background: var(--autumn); }
.s-winter { background: var(--winter); }
.s-spring { background: var(--spring); }
.s-summer { background: var(--summer); }
.marker { position: absolute; top: -9px; bottom: -9px; width: 0; border-left: 3px solid var(--ink); }
.marker span { position: absolute; top: -26px; left: 0; transform: translateX(-50%); background: var(--ink); color: #f3e7c6; font-size: 12.5px; font-weight: 800; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
.now { margin: 6px 0 0; font-weight: 600; }
details.more { margin-top: 8px; }
details.more summary { cursor: pointer; font-weight: 700; font-size: 14.5px; }
.lengths { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.lengths label { display: grid; gap: 4px; font-size: 13.5px; font-weight: 700; }
.lengths input { width: 74px; height: 34px; border: 2px solid var(--ink); border-radius: 8px; background: #f4ebd3; color: var(--ink); font-weight: 700; padding: 0 8px; }

/* ---------- seed pouch ---------- */
.seed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 10px; margin-top: 12px; }
.seed {
  display: grid; gap: 6px; align-content: start; padding: 8px 9px 9px;
  border: 2px solid rgba(42,33,23,.5); border-radius: 12px; background: rgba(255,250,234,.42);
}
.seed.has { border-color: var(--ink); background: rgba(255,246,214,.88); box-shadow: 0 0 0 3px rgba(226,162,58,.8); }
.seed.lvl-bad:not(.has) .pics { opacity: .6; }
.seed-main { display: flex; gap: 8px; align-items: center; background: none; border: 0; padding: 0; text-align: left; color: inherit; cursor: pointer; border-radius: 8px; }
.pics { position: relative; width: 54px; height: 50px; flex: none; }
.seed-ic { width: 46px; height: 46px; }
.crop-ic { position: absolute; right: -6px; bottom: -6px; width: 32px; height: 32px; filter: drop-shadow(0 0 1.5px rgba(255,250,234,1)) drop-shadow(0 0 1px rgba(255,250,234,1)); }
.names { display: grid; line-height: 1.12; min-width: 0; }
.seed, .seed-main { min-width: 0; }
.names b, .names span, .pill, .weed-card, .fert b, .tc-head b, .check b, .leftover span, .big span { overflow-wrap: anywhere; hyphens: auto; }
.names b { font-size: 15.5px; }
.names span { font-size: 14px; color: #5b4a31; }
.pill { justify-self: start; display: inline-block; font-size: 12.5px; font-weight: 700; line-height: 1.25; padding: 2px 8px; border-radius: 999px; border: 1.5px solid var(--ink); }
.pill.good { background: var(--good); }
.pill.warn { background: var(--warn); }
.pill.bad { background: var(--bad); }
.nuts { display: flex; gap: 7px; font-size: 13px; font-variant-numeric: tabular-nums; }
.nut { display: inline-flex; align-items: center; gap: 1px; font-weight: 700; }
.nut-ic { width: 19px; height: 19px; }
.count { display: flex; align-items: center; gap: 6px; }
.mini { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--ink); background: #b78c54; color: var(--ink); font-weight: 800; font-size: 19px; line-height: 1; cursor: pointer; }
.mini:hover { background: #c79b60; }
.qty { width: 48px; height: 34px; text-align: center; border: 2px solid var(--ink); border-radius: 8px; background: #fbf5e4; font-weight: 800; font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 12px; font-size: 13.5px; color: #4a3b26; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }

/* ---------- farm panel ---------- */
.settings { display: flex; flex-wrap: wrap; gap: 14px 26px; margin-top: 12px; align-items: flex-end; }
.size { display: flex; align-items: center; gap: 8px; font-weight: 800; }
.toggles { display: grid; gap: 6px; }
.toggle { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: #57742f; margin: 0; }
.toggle .ic { width: 22px; height: 22px; }
.note { font-size: 13.5px; color: #5b4a31; margin: 6px 0 0; }
.seg-choice { display: inline-flex; flex-wrap: wrap; border: 2px solid var(--ink); border-radius: 10px; overflow: hidden; }
.choice { border: 0; padding: 8px 12px; background: rgba(255,250,232,.55); color: var(--ink); font-weight: 700; font-size: 14px; cursor: pointer; }
.choice + .choice { border-left: 2px solid var(--ink); }
.choice[aria-checked="true"] { background: var(--ink); color: #f3e7c6; }
.soil-opts { display: grid; gap: 6px; margin-top: 8px; }
.hat-grid { display: grid; gap: 8px; margin-top: 8px; }
.hat-tile { border: 2px solid rgba(42,33,23,.55); border-radius: 10px; padding: 4px 8px 8px; display: flex; gap: 6px; flex-wrap: wrap; margin: 0; min-width: 0; }
.hat-tile legend { font-family: var(--font-display); font-weight: 600; padding: 0 4px; }
.hat-in { display: inline-flex; align-items: center; gap: 2px; }
.hat-in input { width: 48px; height: 30px; border: 2px solid var(--ink); border-radius: 7px; background: #fbf5e4; color: var(--ink); font-weight: 700; text-align: center; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { border: 1.5px solid var(--ink); border-radius: 999px; background: rgba(255,250,234,.6); color: var(--ink); font-size: 13px; font-weight: 600; padding: 3px 10px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: #f3e7c6; }
.plan {
  display: block; width: 100%; margin-top: 16px; padding: 10px 18px 12px;
  font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1; color: var(--ink);
  background: linear-gradient(#f2c66b, var(--lantern)); border: 2px solid var(--ink); border-radius: 12px;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 4px 0 #6b4a15; cursor: pointer;
}
.plan:hover { background: linear-gradient(#f6cf7c, #e8ab45); }
.plan:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 2px 0 #6b4a15; }
.plan[disabled] { cursor: progress; opacity: .8; }
.status { min-height: 22px; margin: 8px 0 0; font-weight: 700; }

.summary { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.big { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border: 2px solid var(--ink); border-radius: 12px; background: rgba(255,250,234,.62); }
.big .ic { width: 36px; height: 36px; }
.big b { font-family: var(--font-display); font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.big span { font-size: 14px; font-weight: 700; line-height: 1.1; max-width: 11ch; }

.board-wrap { overflow-x: auto; margin-top: 14px; }
.board {
  display: grid; gap: 12px; padding: 16px 12px 12px; margin: 0 auto; width: min(100%, var(--board-max, 520px));
  background: #3a2918; border: 2px solid var(--ink); border-radius: 10px; box-shadow: inset 0 0 20px rgba(0,0,0,.5);
}
.tile {
  position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; padding: 9px 7px 7px;
  background:
    repeating-linear-gradient(8deg, rgba(0,0,0,.12) 0 2px, transparent 2px 9px),
    radial-gradient(circle at 30% 25%, #75512f, #4b321c 72%);
  border: 2px solid #1b1209; border-radius: 6px; box-shadow: inset 0 0 14px rgba(0,0,0,.5);
}
.tile-name { position: absolute; top: -11px; left: -7px; z-index: 1; padding: 0 7px; border-radius: 6px; background: var(--ink); color: #f3e7c6; font-family: var(--font-display); font-weight: 800; font-size: 14px; line-height: 1.35; pointer-events: none; }
.slot {
  aspect-ratio: 1; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%;
  background: radial-gradient(circle at 50% 62%, #2b1c10 0%, #3a2716 50%, transparent 70%);
}
.slot.plant { cursor: pointer; animation: pop .34s ease-out both; animation-delay: var(--d, 0ms); }
.slot.plant .ic { width: 94%; height: 94%; filter: drop-shadow(0 2px 0 rgba(0,0,0,.5)); }
.slot.plant:hover { background-color: rgba(255,240,200,.12); }
.slot.sel { box-shadow: 0 0 0 3px var(--lantern); background-color: rgba(226,162,58,.3); }
.slot.kin { box-shadow: 0 0 0 2px #f1e1b0; }
@keyframes pop { from { transform: scale(.35); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .slot.plant { animation: none; } }

.field-row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; margin-top: 14px; }
.field-row .board-wrap { flex: 1 1 320px; min-width: 0; margin-top: 0; }
.weed-watch { flex: 0 1 190px; min-width: 170px; padding: 8px 10px 10px; border: 2px solid var(--ink); border-radius: 12px; background: rgba(255,250,234,.6); }
.weed-watch h4 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.05; }
.weed-watch p { margin: 2px 0 8px; font-size: 13.5px; color: #5b4a31; line-height: 1.25; }
.weed-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.weed-card { display: grid; justify-items: center; gap: 2px; padding: 4px 2px 6px; border: 2px solid rgba(42,33,23,.5); border-radius: 10px; background: #4a321d; color: #f3e7c6; font-weight: 700; font-size: 12.5px; line-height: 1.15; text-align: center; cursor: pointer; }
.weed-card img { width: 100%; max-width: 84px; aspect-ratio: 1; object-fit: contain; }
.weed-card:hover { border-color: var(--lantern); }
.weed-hint { margin: 8px 0 0; font-size: 12.5px; color: #5b4a31; }
@media (max-width: 560px) { .weed-watch { flex: 1 1 100%; } .weed-list { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

.lightbox { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 16px; background: rgba(12,14,10,.78); }
.lightbox[hidden] { display: none; }
.lb-card { position: relative; width: min(760px, 100%); max-height: calc(100% - 8px); overflow: auto; }
.lb-close { position: absolute; top: 10px; right: 10px; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
.stage { display: grid; justify-items: center; gap: 4px; padding: 8px; border: 2px solid rgba(42,33,23,.5); border-radius: 12px; background: #4a321d; color: #f3e7c6; text-align: center; }
.stage img { width: 100%; max-width: 190px; aspect-ratio: 1; object-fit: contain; }
.stage b { font-size: 15px; }
.stage span { font-size: 13px; color: #e3d3a8; }
.stage.now { border-color: var(--lantern); box-shadow: 0 0 0 3px var(--lantern); }
.lb-facts { margin: 12px 0 0; padding-left: 20px; display: grid; gap: 4px; max-width: 80ch; }

.detail { margin-top: 12px; }
.detail-card { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border: 2px dashed rgba(42,33,23,.6); border-radius: 10px; background: rgba(255,250,234,.55); }
.detail-card .big-ic { width: 56px; height: 56px; flex: none; }
.stress { display: grid; gap: 4px; margin-top: 6px; }
.srow { display: grid; grid-template-columns: 84px 58px 1fr; gap: 8px; align-items: center; font-size: 14px; }
.srow span:first-child { font-weight: 700; }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: 11px; height: 11px; border-radius: 50%; border: 1.5px solid var(--ink); background: #f6efda; }
.dots i.on { background: #a84a2e; }
.outcome { margin: 6px 0 0; font-weight: 700; }

.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.tile-card { display: grid; gap: 6px; align-content: start; padding: 8px 10px 10px; border: 2px solid rgba(42,33,23,.55); border-radius: 10px; background: rgba(255,250,234,.5); }
.tc-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tc-head b { font-family: var(--font-display); font-size: 19px; }
.mix-row { display: flex; flex-wrap: wrap; gap: 4px 8px; }
.mix { display: inline-flex; align-items: center; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.mix .ic { width: 24px; height: 24px; }
.bar-row { display: grid; grid-template-columns: 20px 1fr 66px; gap: 6px; align-items: center; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.bar { position: relative; height: 11px; border: 1.5px solid var(--ink); border-radius: 6px; background: #f6efda; }
.bar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.fill.n-formula { background: var(--formula); }
.fill.n-compost { background: var(--compost); }
.fill.n-manure { background: var(--manure); }
.bar .was { position: absolute; top: -5px; bottom: -5px; width: 0; border-left: 2px solid var(--ink); }
.advice { margin: 0; font-size: 14px; }

.check { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.check li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.check .ic { width: 28px; height: 28px; }
.check b { min-width: 7.5em; }

.later { display: flex; gap: 8px; align-items: flex-end; height: 130px; padding: 0 2px; border-bottom: 2px solid var(--ink); }
.later-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; min-width: 0; font-variant-numeric: tabular-nums; }
.later-col b { font-size: 13.5px; }
.later-col i { display: block; width: 72%; max-width: 46px; border: 2px solid var(--ink); border-bottom: 0; border-radius: 6px 6px 0 0; }
.later-col.best i { box-shadow: 0 0 0 2px var(--lantern); }
.later-labels { display: flex; gap: 8px; padding: 4px 2px 0; }
.later-labels span { flex: 1; text-align: center; font-size: 12.5px; font-weight: 700; min-width: 0; }
.leftover { display: flex; flex-wrap: wrap; gap: 8px; }
.leftover span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border: 1.5px solid var(--ink); border-radius: 999px; background: rgba(255,250,234,.6); font-size: 13.5px; font-weight: 700; }
.leftover .ic { width: 22px; height: 22px; }
.empty { margin: 14px 0 0; font-weight: 700; }

footer { max-width: 1240px; margin: 0 auto; padding: 0 16px 30px; display: grid; gap: 16px; }
.guide { color: var(--ink); }
.guide-cols { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 18px; margin-top: 10px; }
@media (max-width: 900px) { .guide-cols { grid-template-columns: 1fr; } }
.guide h3 { margin: 4px 0 8px; }
.guide .lead { margin: 4px 0 0; font-size: 15px; color: #4a3b26; max-width: 80ch; }
.fert-list { display: grid; gap: 8px; }
.fert { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; padding: 8px 10px; border: 2px solid rgba(42,33,23,.5); border-radius: 10px; background: rgba(255,250,234,.5); }
.fert .ic { width: 40px; height: 40px; }
.fert b { font-size: 16px; }
.fert .gives { display: inline-block; margin-left: 6px; font-size: 13px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1.5px solid var(--ink); background: #f3ead2; }
.fert ul { margin: 4px 0 0; padding-left: 18px; display: grid; gap: 2px; font-size: 14.5px; }
.fert.rank-1 { border-color: var(--ink); }
.steps-list { margin: 0; padding-left: 0; list-style: none; display: grid; gap: 8px; counter-reset: step; }
.steps-list li { counter-increment: step; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 8px; align-items: start; font-size: 15px; }
.steps-list li::before { content: counter(step); display: grid; place-items: center; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: #f3e7c6; font-weight: 800; font-size: 14px; }
.swap { display: flex; align-items: center; gap: 8px; margin: 10px 0 4px; padding: 8px 10px; border: 2px dashed rgba(42,33,23,.55); border-radius: 10px; background: rgba(255,250,234,.5); font-weight: 700; flex-wrap: wrap; }
.swap img { width: 40px; height: 40px; }
.swap .arrow { font-size: 22px; }
.how { color: var(--ink); }
.how ul { margin: 8px 0 0; padding-left: 20px; display: grid; gap: 4px; max-width: 95ch; }
.fine { color: #bfb08a; font-size: 13.5px; margin: 12px 2px 0; }
.weeds { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 6px; }
.weeds span { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 14px; }
.weeds img { width: 34px; height: 40px; }

@media (max-width: 960px) { .layout { grid-template-columns: 1fr; } }
@media (max-width: 820px) { .top { grid-template-columns: 1fr; } }
@media (max-width: 560px) {
  .seg small, .seg span { display: none; }
  .seg { justify-content: center; padding: 0 2px; }
  .seed-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  .season-btn { width: 64px; }
  .srow { grid-template-columns: 76px 54px 1fr; }
}

/* ---------- language picker ---------- */
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.lang { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; color: #cdbf98; }
.lang .ic { width: 20px; height: 20px; }
.lang select { height: 34px; max-width: 190px; border: 2px solid #cdbf98; border-radius: 9px; background: #2a3123; color: #efe4c4; font: inherit; font-weight: 700; padding: 0 8px; }
:lang(ru) .panel h2, :lang(ru) .panel h3, :lang(ru) .brand h1, :lang(ru) .plan, :lang(ru) .tile-name, :lang(ru) .weed-watch h4, :lang(ru) .big b, :lang(ru) .tc-head b, :lang(ru) .hat-tile legend,
:lang(ja) .panel h2, :lang(ja) .panel h3, :lang(ja) .brand h1, :lang(ja) .plan, :lang(ja) .weed-watch h4, :lang(ja) .tc-head b, :lang(ja) .hat-tile legend,
:lang(ko) .panel h2, :lang(ko) .panel h3, :lang(ko) .brand h1, :lang(ko) .plan, :lang(ko) .weed-watch h4, :lang(ko) .tc-head b, :lang(ko) .hat-tile legend,
:lang(zh) .panel h2, :lang(zh) .panel h3, :lang(zh) .brand h1, :lang(zh) .plan, :lang(zh) .weed-watch h4, :lang(zh) .tc-head b, :lang(zh) .hat-tile legend { font-family: var(--font-body); font-weight: 800; letter-spacing: 0; }
:lang(ja), :lang(ko), :lang(zh) { line-break: strict; word-break: normal; }
:lang(ja) body, :lang(ko) body, :lang(zh) body { font-family: "Alegreya Sans", system-ui, "Hiragino Sans", "Yu Gothic UI", "Malgun Gothic", "Apple SD Gothic Neo", "PingFang SC", "PingFang TC", "Microsoft YaHei", "Microsoft JhengHei", "Noto Sans CJK JP", sans-serif; }

/* ---------- bottom bar (phones) ---------- */
.tabbar { display: none; }
@media (max-width: 760px) {
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom, 0px)); }
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    padding: 6px 6px calc(6px + env(safe-area-inset-bottom, 0px)); gap: 4px;
    background: var(--grain), linear-gradient(#e6dab5, var(--paper-lo)); border-top: 2px solid var(--ink);
    box-shadow: 0 -4px 0 rgba(0,0,0,.35);
  }
  .tabbar button {
    position: relative; display: grid; justify-items: center; gap: 1px; min-height: 54px; padding: 4px 2px 3px;
    border: 2px solid transparent; border-radius: 12px; background: none; color: var(--ink);
    font-weight: 800; font-size: 12.5px; line-height: 1.1; cursor: pointer; text-align: center; overflow-wrap: anywhere;
  }
  .tabbar .ic { width: 28px; height: 28px; }
  .tabbar button[aria-current="page"] { background: var(--ink); color: #f3e7c6; border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--lantern); }
  .tab-badge { position: absolute; top: 1px; left: calc(50% + 8px); min-width: 20px; padding: 0 5px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--lantern); color: var(--ink); font-size: 12px; line-height: 17px; font-variant-numeric: tabular-nums; }
  .tab-badge:empty { display: none; }
  body[data-view="pouch"] [data-view]:not([data-view~="pouch"]),
  body[data-view="plan"] [data-view]:not([data-view~="plan"]),
  body[data-view="settings"] [data-view]:not([data-view~="settings"]),
  body[data-view="guide"] [data-view]:not([data-view~="guide"]) { display: none !important; }
  .top { padding-top: 14px; gap: 10px; }
  .brand .sprout { width: 48px; height: 48px; }
  .brand h1 { font-size: 34px; }
  .brand p { font-size: 14.5px; margin-top: 4px; }
  body:not([data-view="settings"]) .brand p { display: none; }
  .lang { margin-top: 6px; }
  .layout { padding-top: 0; }
  .panel { padding: 14px 12px 16px; }
  .panel h2 { font-size: 26px; }
  #planArea .plan { margin-top: 10px; }
  .summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .big { padding: 6px 10px; }
  .big b { font-size: 28px; }
  .big span { max-width: none; font-size: 13.5px; }
  footer { padding-bottom: 16px; }
}
</style>
</head>

<header class="top">
  <div class="brand">
    <svg class="sprout" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-sprout"></use></svg>
    <div>
      <h1 data-i18n="appTitle">The Grim Gardener</h1>
      <p data-i18n="tagline"></p>
      <label class="lang"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-globe"></use></svg><span class="sr" data-i18n="language">Language</span><select id="langSel"></select></label>
    </div>
  </div>

  <section class="panel" aria-labelledby="h-day" data-view="settings">
    <h2 id="h-day" data-i18n="hDay"></h2>
    <div class="row" style="margin-top:10px">
      <div class="field">
        <span class="lbl" id="lbl-start" data-i18n="worldStarted"></span>
        <div class="seasons" role="radiogroup" aria-labelledby="lbl-start">
          <button type="button" class="season-btn" role="radio" data-season="0" aria-checked="true"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-autumn"></use></svg><span data-g="Autumn"></span></button>
          <button type="button" class="season-btn" role="radio" data-season="1" aria-checked="false"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-winter"></use></svg><span data-g="Winter"></span></button>
          <button type="button" class="season-btn" role="radio" data-season="2" aria-checked="false"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-spring"></use></svg><span data-g="Spring"></span></button>
          <button type="button" class="season-btn" role="radio" data-season="3" aria-checked="false"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-summer"></use></svg><span data-g="Summer"></span></button>
        </div>
      </div>
      <div class="field">
        <label class="lbl" for="day" data-i18n="dayOfRun"></label>
        <div class="stepper"><button type="button" data-step="day" data-by="-1" data-i18n-aria="prevDay">−</button><input id="day" type="number" min="1" max="9999" inputmode="numeric"><button type="button" data-step="day" data-by="1" data-i18n-aria="nextDay">+</button></div>
      </div>
      <div class="field">
        <label class="lbl" for="daysLeft"><span data-i18n="daysLeft"></span> <small data-i18n="optional"></small></label>
        <input class="text-in" id="daysLeft" type="number" min="1" max="99" data-i18n-ph="auto" inputmode="numeric">
      </div>
    </div>
    <div class="ribbon" id="ribbon" aria-hidden="true"></div>
    <p class="now" id="nowText" aria-live="polite"></p>
    <details class="more">
      <summary data-i18n="seasonLengths"></summary>
      <div class="lengths">
        <label for="len0"><span data-g="Autumn"></span><input id="len0" type="number" min="1" max="99" data-len="0"></label>
        <label for="len1"><span data-g="Winter"></span><input id="len1" type="number" min="1" max="99" data-len="1"></label>
        <label for="len2"><span data-g="Spring"></span><input id="len2" type="number" min="1" max="99" data-len="2"></label>
        <label for="len3"><span data-g="Summer"></span><input id="len3" type="number" min="1" max="99" data-len="3"></label>
      </div>
    </details>
  </section>
</header>

<main class="layout">
  <section class="panel" aria-labelledby="h-pouch" id="pouchPanel" data-view="pouch">
    <div class="panel-head">
      <h2 id="h-pouch" data-i18n="hPouch"></h2>

    </div>
    <p class="hint" id="exampleNote" data-i18n="exampleNote"></p>
    <div class="seed-grid" id="seedGrid"></div>
    <div class="legend">
      <span><svg class="ic nut-ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#n-formula"></use></svg><span data-g="Growth Formula"></span></span>
      <span><svg class="ic nut-ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#n-compost"></use></svg><span data-g="Compost (nutrient)"></span></span>
      <span><svg class="ic nut-ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#n-manure"></use></svg><span data-g="Manure (nutrient)"></span></span>
      <span data-i18n="eatsGives"></span>
    </div>
  </section>

  <section class="panel" aria-labelledby="h-farm" id="farmPanel" data-view="settings plan">
    <h2 id="h-farm" data-i18n="hFarm"></h2>
    <div data-view="settings">
    <div class="settings">
      <div class="field">
        <span class="lbl" data-i18n="plotSize"></span>
        <div class="size">
          <div class="stepper"><button type="button" data-step="W" data-by="-1" data-i18n-aria="narrower">−</button><input id="W" type="number" min="1" max="4" data-i18n-aria="plotW"><button type="button" data-step="W" data-by="1" data-i18n-aria="wider">+</button></div>
          <span aria-hidden="true">×</span>
          <div class="stepper"><button type="button" data-step="H" data-by="-1" data-i18n-aria="shorter">−</button><input id="H" type="number" min="1" max="4" data-i18n-aria="plotH"><button type="button" data-step="H" data-by="1" data-i18n-aria="taller">+</button></div>
        </div>
      </div>
      <div class="toggles">
        <label class="toggle" for="water"><input type="checkbox" id="water"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-drop"></use></svg><span data-i18n="water"></span></label>
        <label class="toggle" for="attend"><input type="checkbox" id="attend"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#i-note"></use></svg><span data-i18n="attend"></span></label>
      </div>
    </div>
    <div class="field" style="margin-top:12px">
      <span class="lbl" id="lbl-soil" data-i18n="soilRule"></span>
      <div class="seg-choice" role="radiogroup" aria-labelledby="lbl-soil">
        <button type="button" class="choice" role="radio" data-rule="balanced" aria-checked="true" data-i18n="ruleBalanced"></button>
        <button type="button" class="choice" role="radio" data-rule="every" aria-checked="false" data-i18n="ruleEvery"></button>
      </div>
      <p class="note" id="ruleNote"></p>
    </div>
    <div class="field" style="margin-top:12px">
      <span class="lbl" id="lbl-off" data-i18n="offLabel"></span>
      <div class="seg-choice" role="radiogroup" aria-labelledby="lbl-off">
        <button type="button" class="choice" role="radio" data-off="plant" aria-checked="true" data-i18n="offPlant"></button>
        <button type="button" class="choice" role="radio" data-off="keep" aria-checked="false" data-i18n="offKeep"></button>
      </div>
      <p class="note" id="offNote"></p>
    </div>
    <p class="note" id="sizeNote"></p>
    <details class="more">
      <summary data-i18n="soilFert"></summary>
      <div class="soil-opts">
        <label class="toggle" for="soilFresh"><input type="radio" name="soil" id="soilFresh" value="fresh"><span data-i18n="soilFresh"></span></label>
        <label class="toggle" for="soilHat"><input type="radio" name="soil" id="soilHat" value="hat"><span data-i18n="soilHat"></span></label>
      </div>
      <div id="hatBox" hidden></div>
      <p class="lbl" style="margin:12px 0 0"><span data-i18n="fertHave"></span> <small data-i18n="fertHaveNote"></small></p>
      <div class="chips" id="fertChips"></div>
    </details>
    </div>

    <div data-view="plan" id="planArea">
      <button type="button" class="plan" id="planBtn" data-i18n="planBtn"></button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
      <div id="results"></div>
    </div>
  </section>
</main>

<footer data-view="guide">
  <section class="panel guide" aria-labelledby="h-guide">
    <h2 id="h-guide" data-i18n="hGuide"></h2>
    <p class="lead" data-i18n="guideLead"></p>
    <div class="guide-cols">
      <div>
        <h3 data-i18n="hRefill"></h3>
        <div class="fert-list">
          <div class="fert rank-1"><svg class="ic" viewBox="0 0 64 64" aria-hidden="true"><use href="#n-manure"></use></svg><div><b data-g="Manure"></b><span class="gives">+8 <span data-g="Manure (nutrient)"></span></span>
            <ul><li data-i18n="gManure1"></li><li data-i18n="gManure2"></li></ul></div></div>

<script id="core">
(function () {
'use strict';
/*
 * DST farm planner — core algorithm (no UI).
 *
 * Plot: W x H farm tiles (default 2 x 2: one Garden Digamajig has 4 uses),
 *       3 x 3 planting slots per tile.
 *
 * Per-plant stress. Each source adds +1 at each of the 4 checked stages:
 *   season     checks that land outside the crop's favourite seasons (0-4)
 *   nutrients  consumption events the tile could not fully cover (0-4)
 *   family     4 if fewer than 4 of the crop (itself included) are within
 *              1 tile, else 0
 *   water, attend   4 each if the player does not do them every stage
 * Seeds by total stress: <=6 -> 2, 7-11 -> 1, 12+ -> 0. Every plant gives 1 crop.
 * Giant: total stress <=1 and in season at every check (off-season plants never grow giant).
 *
 * Nutrients are per tile (no exchange between tiles). Each tile holds up to
 * 100 of each nutrient and starts at 20-40 (default here: 20, the worst case).
 * Plants consume and give back the same total, so a balanced tile keeps its
 * jars where they started.
 * Assumption: at each stage end a plant eats, then gives back what it ate;
 * plants that finish a stage at the same moment take turns crop by crop.
 *
 * Goal: most crops + seeds. Ties go to the plan whose tiles stay most
 * balanced (smallest nutrient drift), then fewer seeds used, then lower
 * stress, then the tidiest layout (same crops side by side).
 *
 * Search: (1) per tile, pick the seed mix that best balances the tile's
 * nutrient equation ("nutrients first"); (2) place small groups toward the
 * plot centre so they reach the same crop in neighbouring tiles; (3) polish
 * the whole grid with simulated annealing using the exact per-plant model.
 */

const SEASONS = ['Autumn', 'Winter', 'Spring', 'Summer'];
const NUTRIENTS = ['Formula', 'Compost', 'Manure'];

// seed: the seed's in-game name (shape names are easy to mix up)
// v: nutrient change per stage [formula, compost, manure] (- eats, + gives back)
// s: favourite seasons [autumn, winter, spring, summer]
const CROPS = [
  { name: 'Carrot',       seed: 'Oblong Seeds', code: 'Ca', v: [-4, 2, 2],  s: [1, 1, 1, 0] },
  { name: 'Corn',         seed: 'Clustered Seeds', code: 'Co', v: [2, -4, 2],  s: [1, 0, 1, 1] },
  { name: 'Potato',       seed: 'Fluffy Seeds', code: 'Po', v: [2, 2, -4],  s: [1, 1, 1, 0] },
  { name: 'Toma Root',    seed: 'Spiky Seeds', code: 'To', v: [-2, -2, 4], s: [1, 0, 1, 1] },
  { name: 'Asparagus',    seed: 'Tubular Seeds', code: 'As', v: [2, -4, 2],  s: [0, 1, 1, 0] },
  { name: 'Eggplant',     seed: 'Swirly Seeds', code: 'Eg', v: [2, 2, -4],  s: [1, 0, 1, 0] },
  { name: 'Pumpkin',      seed: 'Sharp Seeds', code: 'Pu', v: [-4, 2, 2],  s: [1, 1, 0, 0] },
  { name: 'Watermelon',   seed: 'Square Seeds', code: 'Wa', v: [4, -2, -2], s: [0, 0, 1, 1] },
  { name: 'Dragon Fruit', seed: 'Bulbous Seeds', code: 'Dr', v: [4, 4, -8],  s: [0, 0, 1, 1] },
  { name: 'Durian',       seed: 'Brittle Seed Pods', code: 'Du', v: [4, -8, 4],  s: [0, 0, 1, 0] },
  { name: 'Garlic',       seed: 'Seed Pods', code: 'Ga', v: [4, -8, 4],  s: [1, 1, 1, 1] },
  { name: 'Onion',        seed: 'Pointy Seeds', code: 'On', v: [-8, 4, 4],  s: [1, 0, 1, 1] },
  { name: 'Pepper',       seed: 'Lumpy Seeds', code: 'Pe', v: [4, 4, -8],  s: [1, 0, 0, 1] },
  { name: 'Pomegranate',  seed: 'Windblown Seeds', code: 'Pm', v: [-8, 4, 4],  s: [0, 0, 1, 1] },

const NC = CROPS.length;
// How much each crop leans on Formula, Compost, Manure; a tile feeds itself when the totals are equal.
const LEAN = CROPS.map(c => { const mx = Math.max(...c.v); return c.v.map(x => (mx - x) / 6); });

// Stage lengths in days of daylight (wiki, low-stress values): [in season, off season].
// The growth buffer stretches them to cover nights and stress slowdowns.
const GERM = [0.4375, 0.875];
const STAGES = [[1, 2], [0.6, 1.2], [0.4, 0.8]]; // sprout, small, medium

// Nutrient points per use (wiki Nutrient page).
const FERTILIZERS = [
  { name: 'Growth Formula Starter', n: [8, 0, 0] },
  { name: 'Spoiled Fish Morsel', n: [8, 0, 0] },
  { name: 'Spoiled Fish', n: [16, 0, 0] },
  { name: 'Fermenting Growth Formula', n: [16, 0, 0] },
  { name: 'Fermented Growth Formula', n: [32, 0, 0] },
  { name: 'Super Growth Formula', n: [32, 0, 0] },
  { name: 'Rot', n: [0, 8, 0] },
  { name: 'Rotten Egg', n: [0, 16, 0] },
  { name: 'Compost', n: [0, 24, 0] },
  { name: 'Moistened Nutribrick', n: [0, 32, 0] },
  { name: 'Manure', n: [0, 0, 8] },
  { name: 'Guano', n: [0, 0, 16] },
  { name: 'Bucket-o-poop', n: [0, 0, 16] },
  { name: "Glommer's Goop", n: [8, 8, 8] },
  { name: 'Fertilizzzer', n: [12, 12, 12] },
  { name: 'Compost Wrap', n: [24, 32, 24] },
  { name: 'Tree Jam', n: [8, 32, 8] },

const FERT_BY_NAME = Object.fromEntries(FERTILIZERS.map(f => [f.name.toLowerCase(), f]));
// Default top-ups use only easy fertilizers, easiest first: Manure, Guano, Rot, Glommer's Goop.
const DEFAULT_FERT = [["Glommer's Goop"], ['Rot', "Glommer's Goop"], ['Manure', 'Guano']];

function findCrop(name) {
  const k = String(name).trim().toLowerCase();
  return CROPS.findIndex(c => c.name.toLowerCase() === k || c.code.toLowerCase() === k || c.seed.toLowerCase() === k);
}

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ---------------- calendar ----------------
function makeCalendar({ startSeason = 0, day = 1, lengths = [20, 15, 20, 15], daysLeft = null }) {
  const order = [0, 1, 2, 3].map(k => (startSeason + k) % 4);
  const lens = order.map(s => lengths[s]);
  const year = lens.reduce((a, b) => a + b, 0);
  const locate = (t) => {
    let tm = ((t % year) + year) % year;
    for (let k = 0; k < 4; k++) {
      if (tm < lens[k]) return { season: order[k], pos: tm, len: lens[k] };
      tm -= lens[k];
    }
    return { season: order[3], pos: lens[3] - 1e-9, len: lens[3] };
  };
  const t0 = day - 1; // time in days since the start of day 1
  let shift = 0;
  if (daysLeft != null && !Number.isNaN(Number(daysLeft))) {
    const base = locate(t0);
    // Days left can't exceed the current season, or the calendar would jump into another season.
    const left = Math.min(base.len, Math.max(1, Math.floor(Number(daysLeft))));
    shift = (base.len - left) - Math.floor(base.pos);
  }
  const seasonAt = (t) => locate(t + shift).season;
  const cur = locate(t0 + shift);
  const dayInSeason = Math.floor(cur.pos) + 1;
  let nx = t0 + 1;
  while (seasonAt(nx) === cur.season && nx < t0 + year) nx++;
  return {
    t0, year, seasonAt,
    current: { season: cur.season, dayInSeason, len: cur.len, daysLeft: cur.len - dayInSeason + 1 },
    next: { season: seasonAt(nx), startDay: nx + 1 },
  };
}

// ---------------- growth timeline ----------------
// checks[k] = moment of stress check k (start of sprout, small, medium, grown);
// the plant eats/gives back nutrients at those same moments (end of each stage).
function timeline(crop, t0, cal, buffer) {
  const inS = (t) => crop.s[cal.seasonAt(t)] === 1;
  let t = t0 + GERM[inS(t0) ? 0 : 1] * buffer;
  const checks = [];
  let off = 0;
  for (let i = 0; i < 3; i++) {
    checks.push(t); if (!inS(t)) off++;
    t += STAGES[i][inS(t) ? 0 : 1] * buffer;
  }
  checks.push(t); if (!inS(t)) off++;
  return { checks, off, ready: t - t0 };
}

function dayContext(t0, cal, buffer) {
  const tl = CROPS.map(c => timeline(c, t0, cal, buffer));
  const ev = [];
  tl.forEach((x, ci) => x.checks.forEach(t => ev.push({ t, ci })));
  ev.sort((a, b) => a.t - b.t || a.ci - b.ci);
  const groups = [];
  for (const e of ev) {
    const g = groups[groups.length - 1];
    if (g && Math.abs(g.t - e.t) < 1e-9) g.crops.push(e.ci);
    else groups.push({ t: e.t, crops: [e.ci] });
  }
  return { t0, tl, groups, off: tl.map(x => x.off) };
}

// ---------------- plot geometry ----------------
// Slot spacing is 1/3 tile, so a radius of 1 tile = 3 slots.
function makeGeometry(W, H, familyTiles = 1, inclusive = true) {
  const cols = 3 * W, rows = 3 * H, n = cols * rows, nTiles = W * H;
  const tileOf = new Int16Array(n);
  const central = new Float64Array(n);
  const R = 3 * familyTiles, R2 = R * R + (inclusive ? 1e-6 : -1e-6);
  const cx = (cols - 1) / 2, cy = (rows - 1) / 2;
  const nbr = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const i = r * cols + c;
    tileOf[i] = Math.floor(r / 3) * W + Math.floor(c / 3);
    central[i] = Math.hypot(r - cy, c - cx);
    const list = [];
    for (let r2 = 0; r2 < rows; r2++) for (let c2 = 0; c2 < cols; c2++) {
      if (r2 === r && c2 === c) continue;
      if ((r2 - r) ** 2 + (c2 - c) ** 2 <= R2) list.push(r2 * cols + c2);
    }
    nbr.push(Int16Array.from(list));
  }
  const tileSlots = Array.from({ length: nTiles }, () => []);
  for (let i = 0; i < n; i++) tileSlots[tileOf[i]].push(i);
  return { W, H, cols, rows, n, nTiles, tileOf, central, nbr, tileSlots };
}

// ---------------- nutrient simulation ----------------
// counts(ci) -> plants of crop ci on the tile; onShort(ci, rank) records stress.
// stats (optional Float64Array(7)): lowest F, C, M during growth, the times they
// happened, and the time the tile's last plant finishes.
function simTile(jarsStart, day, cap, countOf, onShort, stats) {
  const j = [jarsStart[0], jarsStart[1], jarsStart[2]];
  if (stats) { stats[0] = j[0]; stats[1] = j[1]; stats[2] = j[2]; stats[3] = stats[4] = stats[5] = day.t0; stats[6] = day.t0; }
  for (const g of day.groups) {
    for (let r = 0; r < 9; r++) {
      let any = false;
      for (const ci of g.crops) {
        if (countOf(ci) <= r) continue;
        any = true;
        const v = CROPS[ci].v;
        let ate = 0, short = false;
        for (let q = 0; q < 3; q++) if (v[q] < 0) {
          const need = -v[q], take = need < j[q] ? need : j[q];
          if (take < need - 1e-9) short = true;
          j[q] -= take; ate += take;
          if (stats && j[q] < stats[q]) { stats[q] = j[q]; stats[3 + q] = g.t; }
        }
        if (stats) stats[6] = g.t;
        const pos = CROPS[ci].pos;
        for (let q = 0; q < 3; q++) if (v[q] > 0) {
          const x = j[q] + ate * v[q] / pos;
          j[q] = x > cap ? cap : x;
        }
        if (short) onShort(ci, r);
      }
      if (!any) break;
    }
  }
  return j;
}

const seedsFor = (s) => (s <= 6 ? 2 : s <= 11 ? 1 : 0);

// ---------------- full-grid evaluator ----------------
function makeEvaluator(geo, opts) {
  const { n, nTiles, tileOf, nbr, cols } = geo;
  const cnt = new Int16Array(nTiles * NC);
  const slotOf = new Int16Array(nTiles * NC * 9);
  const nut = new Int8Array(n);
  const stats = new Float64Array(7);
  const care = (opts.water ? 0 : 4) + (opts.attend ? 0 : 4);
  const { vegW, seedW, cap } = opts;

  return function evaluate(grid, day, jars0, detail) {
    cnt.fill(0); nut.fill(0);
    for (let i = 0; i < n; i++) {
      const ci = grid[i]; if (ci < 0) continue;
      const k = tileOf[i] * NC + ci;
      slotOf[k * 9 + cnt[k]] = i; cnt[k]++;
    }
    let drift = 0, dip = 0, badTiles = 0, imb = 0;
    const endJars = detail ? [] : null, lows = detail ? [] : null;
    for (let t = 0; t < nTiles; t++) {
      const base = t * NC;
      let n0 = 0, n1 = 0, n2 = 0;
      for (let ci = 0; ci < NC; ci++) { const q = cnt[base + ci]; if (q) { const v = CROPS[ci].v; n0 += q * v[0]; n1 += q * v[1]; n2 += q * v[2]; } }
      imb += Math.abs(n0) + Math.abs(n1) + Math.abs(n2);
      const j = simTile(jars0[t], day, cap, (ci) => cnt[base + ci],
        (ci, r) => { nut[slotOf[(base + ci) * 9 + r]]++; }, stats);
      const j0 = jars0[t];
      const td = Math.abs(j[0] - j0[0]) + Math.abs(j[1] - j0[1]) + Math.abs(j[2] - j0[2]);
      drift += td; if (td > 0.5) badTiles++;
      for (let q = 0; q < 3; q++) dip += Math.max(0, j0[q] - stats[q]);
      if (detail) {
        endJars.push(j);
        lows.push({ min: [stats[0], stats[1], stats[2]], minT: [stats[3], stats[4], stats[5]], lastT: stats[6] });
      }
    }
    let yld = 0, stressSum = 0, used = 0, offSum = 0;
    const plants = detail ? [] : null;
    for (let i = 0; i < n; i++) {
      const ci = grid[i]; if (ci < 0) continue;
      let same = 1;
      const nb = nbr[i];
      for (let m = 0; m < nb.length && same < 4; m++) if (grid[nb[m]] === ci) same++;
      const fam = same >= 4 ? 0 : 4;
      const s = day.off[ci] + nut[i] + fam + care;
      const sd = seedsFor(s);
      yld += vegW + seedW * sd; stressSum += s; used++; offSum += day.off[ci];
      if (detail) plants.push({ slot: i, tile: tileOf[i], ci, season: day.off[ci], nutrient: nut[i], family: fam, care, stress: s, seeds: sd, giant: s <= 1 && day.off[ci] === 0 });
    }
    let tidy = 0;
    for (let i = 0; i < n; i++) {
      if ((i % cols) + 1 < cols && grid[i + 1] === grid[i]) tidy++;
      if (i + cols < n && grid[i + cols] === grid[i]) tidy++;
    }
    return { yld, drift, imb, badTiles, dip, stressSum, used, offSum, tidy, plants, endJars, lows };
  };
}

// ---------------- objective ----------------
function makeObjective(geo, opts) {
  const unit = Math.min(...[opts.vegW, opts.seedW].filter(x => x > 0)) || 1;
  const P = { bw: opts.balanceWeight || 0, nT: geo.nTiles, n: geo.n, seedW: opts.seedW, strict: opts.soilRule !== 'every' };
  // What you end up with: crops + seeds harvested, minus the seeds you planted.
  // A plant that comes back with no seed only trades a seed for a crop.
  const primary = (e) => e.yld - P.seedW * e.used - P.bw * e.drift / 100;
  // Tie-break terms add up to less than one yield unit, so yield always comes first.
  // Balanced soil rule: any drift costs more than any yield it could buy.
  const scalar = (e) => primary(e) - (P.strict ? 2 * (e.imb || 0) : 0) - unit * (
    0.12 * Math.min(1, (e.offSum || 0) / (4 * P.n)) +
    0.30 * Math.min(1, e.drift / (60 * P.nT)) +
    0.05 * (e.badTiles || 0) / P.nT +
    0.12 * Math.min(1, (e.dip || 0) / (60 * P.nT)) +
    0.08 * e.used / P.n +
    0.22 * Math.min(1, e.stressSum / (8 * P.n)) -
    0.05 * (e.tidy || 0) / (2 * P.n));
  // Ties: fewer off-season checks (in-season crops get contested spots, they grow
  // twice as fast), then balanced soil after harvest, then the shallowest dip during
  // growth (crops that grow at the same speed trade in step), then fewer seeds used,
  // lower stress, tidier.
  const better = (a, b) => {
    if (P.strict && Math.abs((a.imb || 0) - (b.imb || 0)) > 1e-9) return (a.imb || 0) < (b.imb || 0);
    const pa = primary(a), pb = primary(b);
    if (Math.abs(pa - pb) > 1e-9) return pa > pb;
    if ((a.offSum || 0) !== (b.offSum || 0)) return (a.offSum || 0) < (b.offSum || 0);
    if (Math.abs(a.drift - b.drift) > 1e-6) return a.drift < b.drift;
    if ((a.badTiles || 0) !== (b.badTiles || 0)) return (a.badTiles || 0) < (b.badTiles || 0);
    if (Math.abs((a.dip || 0) - (b.dip || 0)) > 1e-6) return (a.dip || 0) < (b.dip || 0);
    if (a.used !== b.used) return a.used < b.used;
    if (a.stressSum !== b.stressSum) return a.stressSum < b.stressSum;
    return (a.tidy || 0) > (b.tidy || 0);
  };
  return { scalar, better };
}

// ---------------- step 1: nutrients first, tile by tile ----------------
// Within one tile on the 3x3 grid, any 4 of a crop count as family
// (farthest slots are ~0.94 tile apart).
function bestTileRecipe(remaining, day, jarsT, opts, better, K = 8) {
  const cand = [];
  for (let ci = 0; ci < NC; ci++) if (remaining[ci] > 0) cand.push(ci);
  if (!cand.length) return null;
  cand.sort((a, b) => day.off[a] - day.off[b] || remaining[b] - remaining[a]);
  const C = cand.slice(0, K);
  const inC = new Uint8Array(NC);
  for (const ci of C) inC[ci] = 1;
  // consumption events of the candidate crops only, in time order
  const G = day.groups.map(g => g.crops.filter(ci => inC[ci])).filter(a => a.length);
  const counts = new Int8Array(NC);
  const shortCR = new Int8Array(NC * 9);
  const care = (opts.water ? 0 : 4) + (opts.attend ? 0 : 4);
  const cap = opts.cap, j = [0, 0, 0], lo = [0, 0, 0];
  let best = null;

  const evalRecipe = () => {
    shortCR.fill(0);
    j[0] = jarsT[0]; j[1] = jarsT[1]; j[2] = jarsT[2];
    lo[0] = j[0]; lo[1] = j[1]; lo[2] = j[2];
    for (let g = 0; g < G.length; g++) {
      const crops = G[g];
      for (let r = 0; r < 9; r++) {
        let any = false;
        for (let a = 0; a < crops.length; a++) {
          const ci = crops[a];
          if (counts[ci] <= r) continue;
          any = true;
          const v = CROPS[ci].v;
          let ate = 0, short = false;
          for (let q = 0; q < 3; q++) if (v[q] < 0) {
            const need = -v[q], take = need < j[q] ? need : j[q];
            if (take < need - 1e-9) short = true;
            j[q] -= take; ate += take;
            if (j[q] < lo[q]) lo[q] = j[q];
          }
          const pos = CROPS[ci].pos;
          for (let q = 0; q < 3; q++) if (v[q] > 0) { const x = j[q] + ate * v[q] / pos; j[q] = x > cap ? cap : x; }
          if (short) shortCR[ci * 9 + r]++;
        }
        if (!any) break;
      }
    }
    const drift = Math.abs(j[0] - jarsT[0]) + Math.abs(j[1] - jarsT[1]) + Math.abs(j[2] - jarsT[2]);
    const dip = Math.max(0, jarsT[0] - lo[0]) + Math.max(0, jarsT[1] - lo[1]) + Math.max(0, jarsT[2] - lo[2]);
    let n0 = 0, n1 = 0, n2 = 0;
    for (const ci of C) if (counts[ci]) { const v = CROPS[ci].v; n0 += counts[ci] * v[0]; n1 += counts[ci] * v[1]; n2 += counts[ci] * v[2]; }
    const imb = Math.abs(n0) + Math.abs(n1) + Math.abs(n2);
    let yld = 0, stressSum = 0, used = 0, offSum = 0;
    for (const ci of C) {
      const fam = counts[ci] >= 4 ? 0 : 4;
      for (let r = 0; r < counts[ci]; r++) {
        const s = day.off[ci] + shortCR[ci * 9 + r] + fam + care;
        yld += opts.vegW + opts.seedW * seedsFor(s); stressSum += s; used++; offSum += day.off[ci];
      }
    }
    return { yld, drift, imb, dip, stressSum, used, offSum };
  };
  const rec = (idx, total) => {
    if (total > 0 || opts.soilRule !== 'every') {
      const e = evalRecipe();
      if (!best || better(e, best)) best = { ...e, counts: counts.slice() };
    }
    if (total === 9) return;
    for (let a = idx; a < C.length; a++) {
      const ci = C[a];
      if (counts[ci] >= remaining[ci]) continue;
      counts[ci]++; rec(a, total + 1); counts[ci]--;
    }
  };
  rec(0, 0);
  return best && best.used ? best : null;
}

// ---------------- step 2: place, small groups toward the plot centre ----------------
function placeRecipe(grid, geo, t, counts) {
  const slots = geo.tileSlots[t].slice().sort((a, b) => geo.central[a] - geo.central[b]);
  const items = [];
  for (let ci = 0; ci < NC; ci++) if (counts[ci] > 0) items.push(ci);
  items.sort((a, b) => counts[a] - counts[b] || a - b);
  let k = 0;
  for (const ci of items) for (let m = 0; m < counts[ci]; m++) grid[slots[k++]] = ci;
}

function construct(geo, inv, day, jars0, opts, better, tileOrder) {
  const grid = new Int8Array(geo.n).fill(-1);
  const remaining = inv.slice();
  for (const t of tileOrder) {
    const r = bestTileRecipe(remaining, day, jars0[t], opts, better);
    if (!r) { if (opts.soilRule === 'every') break; continue; }
    for (let ci = 0; ci < NC; ci++) remaining[ci] -= r.counts[ci];
    placeRecipe(grid, geo, t, r.counts);
  }
  return grid;
}

// ---------------- balanced rule: whole-pouch construction ----------------
// 1) Largest balanced set of seeds for the whole pouch (DP over the lean difference).
//    In-season plants count 1, off-season ones 0.8 so in-season crops win ties.
// 2) Split it into small balanced groups (pairs, trios...) and pack them onto tiles,
//    keeping identical groups together so they also form families.
function balancedSet(inv, day, cap) {
  const items = [];
  for (let ci = 0; ci < NC; ci++) {
    if (inv[ci] <= 0) continue;
    items.push({ ci, m: [LEAN[ci][0] - LEAN[ci][2], LEAN[ci][1] - LEAN[ci][2]], max: Math.min(inv[ci], cap), w: day.off[ci] === 0 ? 1 : 0.8 });
  }
  if (!items.length) return null;
  const total = items.reduce((a, it) => a + it.max, 0);
  const B = Math.max(2, Math.min(2 * cap + 4, 2 * total));
  const W = 2 * B + 1, S = W * W;
  const at = (a, b) => (a + B) * W + (b + B);
  let dp = new Float64Array(S).fill(-1);
  dp[at(0, 0)] = 0;
  const choice = [];
  for (const it of items) {
    const nd = new Float64Array(S).fill(-1);
    const ch = new Int16Array(S).fill(-1);
    for (let s = 0; s < S; s++) {
      if (dp[s] < 0) continue;
      const a = Math.floor(s / W) - B, b = (s % W) - B;
      for (let c = 0; c <= it.max; c++) {
        const na = a + c * it.m[0], nb = b + c * it.m[1];
        if (na < -B || na > B || nb < -B || nb > B) break;
        const t = at(na, nb), v = dp[s] + c * it.w;
        if (v > nd[t] + 1e-9) { nd[t] = v; ch[t] = c; }
      }
    }
    choice.push(ch); dp = nd;
  }
  if (!(dp[at(0, 0)] > 0)) return null;
  const counts = new Array(NC).fill(0);
  let a = 0, b = 0;
  for (let k = items.length - 1; k >= 0; k--) {
    const c = choice[k][at(a, b)];
    counts[items[k].ci] = c;
    a -= c * items[k].m[0]; b -= c * items[k].m[1];
  }
  return counts;
}

function balancedGroups(counts) {
  const rem = counts.slice();
  const groups = [];
  while (rem.some(q => q > 0)) {
    const P = [];
    for (let ci = 0; ci < NC; ci++) if (rem[ci] > 0) P.push(ci);
    let found = null;
    const pick = new Array(NC).fill(0);
    const dfs = (i, left, l0, l1, l2) => {
      if (left === 0) { if (Math.abs(l0 - l1) < 1e-9 && Math.abs(l1 - l2) < 1e-9) found = pick.slice(); return; }
      for (let k = i; k < P.length && !found; k++) {
        const ci = P[k];
        if (pick[ci] >= rem[ci]) continue;
        pick[ci]++; dfs(k, left - 1, l0 + LEAN[ci][0], l1 + LEAN[ci][1], l2 + LEAN[ci][2]); pick[ci]--;
      }
    };
    for (let size = 2; size <= 9 && !found; size++) dfs(0, size, 0, 0, 0);
    if (!found) break;
    groups.push(found);
    found.forEach((q, ci) => { rem[ci] -= q; });
  }
  return groups;
}

function balancedConstruct(geo, inv, day) {
  const grid = new Int8Array(geo.n).fill(-1);
  const counts = balancedSet(inv, day, geo.n);
  if (!counts) return grid;
  const groups = balancedGroups(counts).sort((x, y) => y.reduce((a, b) => a + b, 0) - x.reduce((a, b) => a + b, 0));
  const tiles = Array.from({ length: geo.nTiles }, () => ({ counts: new Array(NC).fill(0), size: 0 }));
  for (const g of groups) {
    const size = g.reduce((a, b) => a + b, 0);
    let best = null, bestScore = -1;
    for (const t of tiles) {
      if (t.size + size > 9) continue;
      const overlap = g.reduce((a, q, ci) => a + Math.min(q, t.counts[ci]), 0);
      const score = overlap * 100 + t.size;
      if (score > bestScore) { bestScore = score; best = t; }
    }
    if (!best) continue;
    g.forEach((q, ci) => { best.counts[ci] += q; });
    best.size += size;
  }
  tiles.forEach((t, k) => placeRecipe(grid, geo, k, t.counts));
  return grid;
}

// ---------------- step 3: polish the whole grid ----------------
function anneal(grid0, inv, evaluate, obj, day, jars0, iters, rng, T0 = 2.0, T1 = 0.0005) {
  const n = grid0.length;
  const grid = Int8Array.from(grid0);
  const used = new Int16Array(NC);
  for (const ci of grid) if (ci >= 0) used[ci]++;
  const owned = [];
  for (let ci = 0; ci < NC; ci++) if (inv[ci] > 0) owned.push(ci);
  let cur = evaluate(grid, day, jars0, false), curS = obj.scalar(cur);
  let best = cur, bestGrid = Int8Array.from(grid);
  if (!owned.length) return { grid: bestGrid, eval: best };
  for (let it = 0; it < iters; it++) {
    const T = T0 * Math.pow(T1 / T0, it / iters);
    let s1, s2 = -1, old;
    if (rng() < 0.45) {
      s1 = Math.floor(rng() * n); old = grid[s1];
      const pick = Math.floor(rng() * (owned.length + 1));
      const nw = pick === owned.length ? -1 : owned[pick];
      if (nw === old || (nw >= 0 && used[nw] >= inv[nw])) continue;
      grid[s1] = nw;
      const e = evaluate(grid, day, jars0, false), sc = obj.scalar(e);
      if (sc - curS >= -1e-12 || rng() < Math.exp((sc - curS) / T)) {
        if (old >= 0) used[old]--; if (nw >= 0) used[nw]++;
        cur = e; curS = sc;
        if (obj.better(cur, best)) { best = cur; bestGrid = Int8Array.from(grid); }
      } else grid[s1] = old;
    } else {
      s1 = Math.floor(rng() * n); s2 = Math.floor(rng() * n);
      if (grid[s1] === grid[s2]) continue;
      let tmp = grid[s1]; grid[s1] = grid[s2]; grid[s2] = tmp;
      const e = evaluate(grid, day, jars0, false), sc = obj.scalar(e);
      if (sc - curS >= -1e-12 || rng() < Math.exp((sc - curS) / T)) {
        cur = e; curS = sc;
        if (obj.better(cur, best)) { best = cur; bestGrid = Int8Array.from(grid); }
      } else { tmp = grid[s1]; grid[s1] = grid[s2]; grid[s2] = tmp; }
    }
  }
  return { grid: bestGrid, eval: best };
}

function optimizeDay(geo, inv, day, jars0, opts, iters, runs, seed, startGrid = null) {
  const evaluate = makeEvaluator(geo, opts);
  const obj = makeObjective(geo, opts);
  const rng = mulberry32(seed);
  const natural = [...Array(geo.nTiles).keys()];
  let best = null;
  const strict = opts.soilRule !== 'every';
  for (let r = 0; r < runs; r++) {
    let res;
    if (strict && r === 0 && !startGrid) {
      res = anneal(balancedConstruct(geo, inv, day), inv, evaluate, obj, day, jars0, iters, rng, 0.8);
    } else if (startGrid && r === 0) {
      const g0 = Int8Array.from(startGrid), have = inv.slice();
      for (let i = 0; i < g0.length; i++) if (g0[i] >= 0) { if (have[g0[i]] > 0) have[g0[i]]--; else g0[i] = -1; }
      res = anneal(g0, inv, evaluate, obj, day, jars0, iters, rng, 0.8);
    } else if (r < 2 + (startGrid ? 1 : 0) && r <= 1 + (startGrid ? 1 : 0)) {
      const order = (r === 0 || (startGrid && r === 1)) ? natural : natural.slice().reverse();
      res = anneal(construct(geo, inv, day, jars0, opts, obj.better, order), inv, evaluate, obj, day, jars0, iters, rng);
    } else {
      res = anneal(best.grid, inv, evaluate, obj, day, jars0, iters, rng, 0.6);
    }
    if (!best || obj.better(res.eval, best.eval)) best = res;
  }
  best.detail = evaluate(best.grid, day, jars0, true);
  return best;
}

// ---------------- config ----------------
function normalizeConfig(cfg = {}) {
  const SIDX = { autumn: 0, winter: 1, spring: 2, summer: 3 };
  const startSeason = SIDX[String(cfg.startSeason || 'autumn').toLowerCase()];
  if (startSeason == null) throw new Error('startSeason must be autumn, winter, spring or summer');
  const L = cfg.seasonLengths || {};
  const lengths = [L.autumn ?? 20, L.winter ?? 15, L.spring ?? 20, L.summer ?? 15];
  const W = cfg.plot?.width ?? 2, H = cfg.plot?.height ?? 2;
  const nTiles = W * H;
  const inv = new Array(NC).fill(0);
  const unknown = [];
  for (const [k, q] of Object.entries(cfg.seeds || {})) {
    const ci = findCrop(k);
    if (ci < 0) unknown.push(k); else inv[ci] += Math.max(0, Math.floor(Number(q) || 0));
  }
  const sj = cfg.startingNutrients ?? [20, 20, 20];
  let jars0;
  if (Array.isArray(sj[0])) {
    if (sj.length !== nTiles) throw new Error(`startingNutrients needs ${nTiles} tiles (row by row) or one [F,C,M] for all`);
    jars0 = sj.map(a => a.map(Number));
  } else jars0 = Array.from({ length: nTiles }, () => sj.map(Number));
  return {
    startSeason, day: cfg.day ?? 1, lengths, daysLeft: cfg.daysLeftOverride ?? null,
    W, H, inv, unknown, jars0, cap: 100,
    water: cfg.waterEveryStage ?? true, attend: cfg.attendEveryStage ?? true,
    vegW: cfg.cropWeight ?? 1, seedW: cfg.seedWeight ?? 1, balanceWeight: cfg.balanceWeight ?? 0,
    buffer: cfg.growthBuffer ?? 1.25,
    familyTiles: cfg.familyRadiusTiles ?? 1, inclusive: cfg.familyRadiusInclusive ?? true,
    scanDays: cfg.scanDays ?? 10, iterations: cfg.iterations ?? 40000, seed: cfg.randomSeed ?? 1,
    fertilizersOnHand: cfg.fertilizersOnHand || null,
    // 'plant': plant off-season seeds when they pay off; 'keep': only plant crops in season for the whole growth
    offSeason: cfg.offSeasonSeeds === 'keep' ? 'keep' : 'plant',
    // 'balanced': every tile must feed itself (default); 'every': plant every seed that pays off, top up with fertilizer
    soilRule: cfg.soilRule === 'every-seed' || cfg.soilRule === 'every' ? 'every' : 'balanced',
  };
}

// ---------------- reports ----------------
function cropOutlook(ci, cal, buffer) {
  const crop = CROPS[ci];
  const tl = timeline(crop, cal.t0, cal, buffer);
  const inNow = crop.s[cal.seasonAt(cal.t0)] === 1;
  let nextGoodDay = null;
  for (let d = 0; d <= cal.year * 2; d++) {
    if (timeline(crop, cal.t0 + d, cal, buffer).off === 0) { nextGoodDay = cal.t0 + d + 1; break; }
  }
  let status, level;
  if (tl.off === 0) { status = 'in season through harvest'; level = 'good'; }
  else if (tl.off === 4) { status = 'off-season'; level = 'bad'; }
  else { status = (inNow ? 'season ends before harvest' : 'comes into season while growing') + `: ${tl.off} of 4 checks off-season`; level = 'warn'; }
  return { ci, name: crop.name, off: tl.off, inNow, readyDay: Math.floor(cal.t0 + tl.ready) + 1, status, level, nextGoodDay };
}

function seasonCheck(C, cal) {
  const out = [];
  for (let ci = 0; ci < NC; ci++) if (C.inv[ci]) out.push({ ...cropOutlook(ci, cal, C.buffer), owned: C.inv[ci] });
  return out;
}

const plainCalendar = (cal) => ({ t0: cal.t0, year: cal.year, current: cal.current, next: cal.next });

// Season outlook for all crops on a given day (no planning).
function outlook(cfg = {}) {
  const C = normalizeConfig({ ...cfg, seeds: {} });
  const cal = makeCalendar({ startSeason: C.startSeason, day: C.day, lengths: C.lengths, daysLeft: C.daysLeft });
  const order = [0, 1, 2, 3].map(k => (C.startSeason + k) % 4);
  return { calendar: plainCalendar(cal), order, lengths: C.lengths, crops: CROPS.map((_, ci) => cropOutlook(ci, cal, C.buffer)) };
}

function fertilizerAdvice(start, end, onHand) {
  const out = [];
  for (let q = 0; q < 3; q++) {
    const deficit = start[q] - end[q];
    if (deficit < 4) continue;
    const names = onHand
      ? onHand.filter(nm => { const f = FERT_BY_NAME[String(nm).toLowerCase()]; return f && f.n[q] > 0; })
      : DEFAULT_FERT[q];
    const options = names.map(nm => {
      const f = FERT_BY_NAME[String(nm).toLowerCase()];
      return `${f.name} x${Math.ceil(deficit / f.n[q])}`;
    });
    const items = names.map(nm => { const f = FERT_BY_NAME[String(nm).toLowerCase()]; return { name: f.name, count: Math.ceil(deficit / f.n[q]) }; });
    out.push({ q, nutrient: NUTRIENTS[q], deficit: Math.round(deficit), options, items });
  }
  return out;
}


// Cheapest extra seeds (crops in season on this day) that make the leftovers' lean equal.
// Crops already in the pouch cost 1, others 2.5, so suggestions stick to seeds you know.
function balancingSeeds(left, day, owned) {
  const start = [0, 0, 0];
  left.forEach((q, ci) => { for (let k = 0; k < 3; k++) start[k] += q * LEAN[ci][k]; });
  const key = (a, b) => a + ',' + b;
  const s0 = [start[0] - start[2], start[1] - start[2]];
  if (s0[0] === 0 && s0[1] === 0) return [];
  const moves = [];
  for (let ci = 0; ci < NC; ci++) {
    if (day.off[ci] !== 0) continue;
    moves.push({ ci, m: [LEAN[ci][0] - LEAN[ci][2], LEAN[ci][1] - LEAN[ci][2]], cost: owned[ci] > 0 ? 1 : 2.5 });
  }
  const dist = new Map([[key(s0[0], s0[1]), 0]]);
  const prev = new Map([[key(s0[0], s0[1]), null]]);
  const done = new Set();
  let open = [{ st: s0, d: 0 }];
  while (open.length) {
    open.sort((a, b) => a.d - b.d);
    const { st, d } = open.shift();
    const k = key(st[0], st[1]);
    if (done.has(k)) continue;
    done.add(k);
    if (st[0] === 0 && st[1] === 0) {
      const add = new Array(NC).fill(0);
      let cur = k;
      while (prev.get(cur)) { const p = prev.get(cur); add[p.ci]++; cur = p.from; }
      return add;
    }
    if (d > 40) break;
    for (const mv of moves) {
      const ns = [st[0] + mv.m[0], st[1] + mv.m[1]];
      if (Math.abs(ns[0]) > 30 || Math.abs(ns[1]) > 30) continue;
      const nk = key(ns[0], ns[1]), nd = d + mv.cost;
      if (!dist.has(nk) || nd < dist.get(nk) - 1e-9) { dist.set(nk, nd); prev.set(nk, { from: k, ci: mv.ci }); open.push({ st: ns, d: nd }); }
    }
  }
  return null;
}

function planFarm(cfg) {
  const started = Date.now();
  const C = normalizeConfig(cfg);
  const cal = makeCalendar({ startSeason: C.startSeason, day: C.day, lengths: C.lengths, daysLeft: C.daysLeft });
  const geo = makeGeometry(C.W, C.H, C.familyTiles, C.inclusive);
  const opts = { water: C.water, attend: C.attend, vegW: C.vegW, seedW: C.seedW, cap: C.cap, balanceWeight: C.balanceWeight, soilRule: C.soilRule };

  const invFor = (day) => (C.offSeason === 'keep' ? C.inv.map((q, ci) => (day.off[ci] > 0 ? 0 : q)) : C.inv);
  const day0 = dayContext(cal.t0, cal, C.buffer);
  const today = optimizeDay(geo, invFor(day0), day0, C.jars0, opts, C.iterations, 3, C.seed);

  const scan = [];
  for (let d = 0; d <= C.scanDays; d++) {
    if (d === 0) { scan.push({ day: cal.t0 + 1, season: cal.seasonAt(cal.t0), yld: today.eval.yld, plants: today.eval.used }); continue; }
    const dc = dayContext(cal.t0 + d, cal, C.buffer);
    const r = optimizeDay(geo, invFor(dc), dc, C.jars0, opts, Math.max(4000, Math.round(C.iterations / 5)), 1, C.seed + d, today.grid);
    scan.push({ day: cal.t0 + d + 1, season: cal.seasonAt(cal.t0 + d), yld: r.eval.yld, plants: r.eval.used });
  }

  const det = today.detail;
  const tiles = [];
  for (let t = 0; t < geo.nTiles; t++) {
    const counts = new Array(NC).fill(0);
    for (const i of geo.tileSlots[t]) if (today.grid[i] >= 0) counts[today.grid[i]]++;
    const start = C.jars0[t], end = det.endJars[t], low = det.lows[t];
    const change = end.map((x, q) => x - start[q]);
    const drift = change.reduce((a, x) => a + Math.abs(x), 0);
    // A dip worth flagging: a jar falls to under 8 (one stage of a heavy eater) or 12+ below where it started.
    let lowest = null;
    for (let q = 0; q < 3; q++) {
      const temporary = end[q] - low.min[q] >= 8;
      if (temporary && (low.min[q] < 8 || start[q] - low.min[q] >= 12)) {
        if (!lowest || low.min[q] < lowest.value) lowest = { q, nutrient: NUTRIENTS[q], value: low.min[q], day: Math.floor(low.minT[q]) + 1 };
      }
    }
    if (lowest) lowest.recoversDay = Math.floor(low.lastT) + 1;
    tiles.push({ index: t, counts, start, end, change, balanced: drift < 0.5, lowest, advice: fertilizerAdvice(start, end, C.fertilizersOnHand) });
  }

  const usedCounts = new Array(NC).fill(0);
  for (const ci of today.grid) if (ci >= 0) usedCounts[ci]++;
  const sc = seasonCheck(C, cal);
  const leftovers = [];
  for (let ci = 0; ci < NC; ci++) {
    const left = C.inv[ci] - usedCounts[ci];
    if (left > 0) leftovers.push({ ci, name: CROPS[ci].name, left, offSeason: day0.off[ci] > 0, nextGoodDay: (sc.find(x => x.ci === ci) || {}).nextGoodDay });
  }
  const seedsHarvested = det.plants.reduce((a, p) => a + p.seeds, 0);

  // Balanced rule: suggest the fewest extra seeds that would let the in-season leftovers be planted,
  // and check it with a real re-plan before showing it.
  let seedsToGet = null;
  if (C.soilRule === 'balanced') {
    const left = new Array(NC).fill(0);
    for (const l of leftovers) if (day0.off[l.ci] === 0) left[l.ci] = l.left;
    if (left.some(q => q > 0)) {
      const add = balancingSeeds(left, day0, C.inv);
      if (add && add.some(q => q > 0)) {
        const inv2 = invFor(day0).map((q, ci) => q + add[ci]);
        const r2 = optimizeDay(geo, inv2, day0, C.jars0, opts, Math.max(6000, Math.round(C.iterations / 3)), 2, C.seed + 101);
        const used2 = new Array(NC).fill(0);
        for (const ci of r2.grid) if (ci >= 0) used2[ci]++;
        const plantedLeft = left.reduce((a, q, ci) => a + Math.min(q, Math.max(0, used2[ci] - usedCounts[ci])), 0);
        const gain = (r2.eval.yld - r2.eval.used) - (today.eval.yld - today.eval.used);
        if (plantedLeft > 0 && gain > 0) {
          seedsToGet = {
            add: add.map((q, ci) => (q ? { ci, name: CROPS[ci].name, seed: CROPS[ci].seed, count: q } : null)).filter(Boolean),
            leftoversPlanted: plantedLeft, leftoversTotal: left.reduce((a, b) => a + b, 0),
            cropsAndSeedsAfter: r2.detail.plants.reduce((a, p) => a + 1 + p.seeds, 0),
          };
        } else seedsToGet = { add: [], reason: 'no-room' };
      }
    }
  }

  return {
    config: C, calendar: plainCalendar(cal),
    geometry: { W: geo.W, H: geo.H, cols: geo.cols, rows: geo.rows, n: geo.n, nTiles: geo.nTiles },
    grid: Array.from(today.grid),
    plants: det.plants, tiles, seasonCheck: sc, leftovers, seedsToGet, scan,
    totals: { plants: det.used, crops: det.used, seeds: seedsHarvested, netSeeds: seedsHarvested - det.used, score: det.yld, giants: det.plants.filter(p => p.giant).length },
    nextSeasonCrops: CROPS.filter(c => c.s[cal.next.season]).map(c => c.name),
    ms: Date.now() - started,
  };
}

const API = {
  SEASONS, NUTRIENTS, CROPS, FERTILIZERS, findCrop, makeCalendar, timeline, dayContext,
  makeGeometry, makeEvaluator, simTile, seedsFor, normalizeConfig, outlook, planFarm,
};
if (typeof module !== 'undefined' && module.exports) module.exports = API;
if (typeof self !== 'undefined') self.DSTCore = API;

})();
</script>
<script>

  let lang = 'en';

  const G = (en) => (I18N[lang]._names && I18N[lang]._names[en]) || (GAME_NAMES[lang] && GAME_NAMES[lang][en]) || GAME_NAMES.en[en] || en;

  const Tx = (key, vars) => { const d = document.createElement('div'); d.innerHTML = T(key, vars); return d.textContent; };
  const list = (arr) => arr.join(raw('orWord'));

    state.lang = lang; save();

  const cropPic = (ci, cls) => `<img class="ic pic ${cls || ''}" src="img/crop-${CROP_IMG[ci]}.png" alt="" draggable="false">`;
  const seedPic = (ci, cls) => `<img class="ic pic ${cls || ''}" src="img/seed-${SEED_IMG[ci]}.png" alt="" draggable="false">`;
  const cropName = (ci) => G(CROPS[ci].name);
  const seedName = (ci) => G(CROPS[ci].seed);

  function defaults() {
    return { startSeason: 0, day: 5, daysLeft: '', lengths: [20, 15, 20, 15], seeds: Object.assign({}, EXAMPLE), example: true,
      W: 2, H: 2, water: true, attend: true, soilRule: 'balanced', offSeason: 'plant', soil: 'fresh', jars: {}, ferts: [], lang: '', view: 'pouch' };

  let state = load();
