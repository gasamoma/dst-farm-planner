        <button type="button" class="seed-main" data-add="${ci}" aria-label="${esc(Tx('addOne', sv))}">
          <span class="pics">${seedPic(ci, 'seed-ic')}${cropPic(ci, 'crop-ic')}</span>
          <span class="names"><b>${esc(sv.seed)}</b><span>${T('grows', { crop: sv.crop })}</span></span>
        </button>
        <span class="pill ${ol.level}" title="${esc(statusText(ol) + '; ' + Tx('readyAbout', { d: ol.readyDay }))}">${badge(ol)}</span>
        <span class="nuts">${nuts}</span>
        <span class="count">
          <button type="button" class="mini" data-sub="${ci}" aria-label="${esc(Tx('removeOne', sv))}">−</button>
          <input class="qty" id="qty-${ci}" type="number" min="0" max="99" inputmode="numeric" value="${q}" data-qty="${ci}" aria-label="${esc(Tx('inPouch', sv))}">
          <button type="button" class="mini" data-add="${ci}" aria-label="${esc(Tx('addOne', sv))}">+</button>
        </span>
      </div>`;
    }).join('');
    updatePouchMeta();
  }
  function updateSeedCard(ci) {
    const q = state.seeds[CROPS[ci].name] || 0;
    const card = document.querySelector(`.seed[data-ci="${ci}"]`);
    if (!card) return;
    card.classList.toggle('has', q > 0);
    const inp = card.querySelector('.qty');
    if (document.activeElement !== inp) inp.value = q;
    updatePouchMeta();
  }
  function updatePouchMeta() {
    $('#pouchCount').textContent = Tx('seedCount', { n: totalSeeds() });
    $('#exampleNote').hidden = !state.example;
    updateBadges();
  }
  function setSeed(ci, q) {
    const name = CROPS[ci].name;
    q = clamp(Math.floor(Number(q) || 0), 0, 99);
    if (q) state.seeds[name] = q; else delete state.seeds[name];
    state.example = false;
    save(); updateSeedCard(ci); schedulePlan();
  }

  // ---------- farm settings ----------
  function renderFarm() {
    if (document.activeElement !== $('#W')) $('#W').value = state.W;
    if (document.activeElement !== $('#H')) $('#H').value = state.H;
    $('#water').checked = state.water;
    $('#attend').checked = state.attend;
    $$('input[name=soil]').forEach((r) => { r.checked = r.value === state.soil; });
    $$('[data-rule]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.rule === state.soilRule)));
    $('#ruleNote').innerHTML = T(state.soilRule === 'every' ? 'ruleNoteEvery' : 'ruleNoteBalanced');
    $$('[data-off]').forEach((b) => b.setAttribute('aria-checked', String(b.dataset.off === state.offSeason)));
    $('#offNote').innerHTML = T(state.offSeason === 'plant' ? 'offNotePlant' : 'offNoteKeep');
    const nT = state.W * state.H;
    $('#sizeNote').innerHTML = T('sizeNote', { n: nT, spots: nT * 9 });
    renderHat();
    $('#fertChips').innerHTML = C.FERTILIZERS.map((f) => `<button type="button" class="chip" data-fert="${esc(f.name)}" aria-pressed="${state.ferts.includes(f.name)}">${esc(G(f.name))}</button>`).join('');
  }
  function renderHat() {
    const box = $('#hatBox');
    box.hidden = state.soil !== 'hat';
    if (box.hidden) { box.innerHTML = ''; return; }
    let html = `<div class="hat-grid" style="grid-template-columns:repeat(${state.W},minmax(0,1fr))">`;
    for (let t = 0; t < state.W * state.H; t++) {
      const j = state.jars[t] || [20, 20, 20];
      const tn = Tx('tileN', { t: letter(t) });
      html += `<fieldset class="hat-tile"><legend>${esc(tn)}</legend>` + NUT.map((n, k) =>
        `<label class="hat-in" for="jar-${t}-${k}" title="${esc(G(n.name))}">${use('n-' + n.id, 'nut-ic')}<input id="jar-${t}-${k}" type="number" min="0" max="100" inputmode="numeric" value="${j[k]}" data-jar="${t}:${k}" aria-label="${esc(tn + ': ' + G(n.name))}"></label>`).join('') + '</fieldset>';
    }
    box.innerHTML = html + '</div>';
  }

  // ---------- planning (runs in a Web Worker when the browser allows it) ----------
  const coreSrc = document.getElementById('core').textContent;
  let workerURL = null, worker = null, workerOK = typeof Worker !== 'undefined', busy = false, runId = 0;
  function makeWorker() {
    if (!workerOK) return null;
    try {
      if (!workerURL) {
        const glue = '\nself.onmessage=function(e){var d=e.data;try{self.postMessage({id:d.id,ok:true,res:self.DSTCore.planFarm(d.cfg)})}catch(err){self.postMessage({id:d.id,ok:false,error:String(err&&err.message||err)})}};';
        workerURL = URL.createObjectURL(new Blob([coreSrc + glue], { type: 'text/javascript' }));
      }
      return new Worker(workerURL);
    } catch (e) { workerOK = false; return null; }
  }
  function runPlan(cfg) {
    const id = ++runId;
    return new Promise((resolve, reject) => {
      const onMain = () => setTimeout(() => {
        if (id !== runId) return;
        try { resolve(C.planFarm(cfg)); } catch (e) { reject(e); }
      }, 30);
      if (busy && worker) { worker.terminate(); worker = null; }
      if (!worker) worker = makeWorker();
      if (!worker) { onMain(); return; }
      busy = true;
      worker.onmessage = (e) => {
        if (e.data.id !== runId) return;
        busy = false;
        if (e.data.ok) resolve(e.data.res); else reject(new Error(e.data.error));
      };
      worker.onerror = (ev) => {
        if (ev && ev.preventDefault) ev.preventDefault();
        busy = false; workerOK = false;
        try { worker.terminate(); } catch (_) { /* already gone */ }
        worker = null; onMain();
      };
      worker.postMessage({ id, cfg });
    });
  }

  let timer = null;
  function schedulePlan() {
    clearTimeout(timer);
    $('#status').textContent = Tx('stUpdating');
    timer = setTimeout(plan, 650);
  }
  async function plan() {
    clearTimeout(timer);
    if (!totalSeeds()) {
      lastResult = null;
      $('#status').textContent = '';
      $('#results').innerHTML = `<p class="empty">${T('emptyPouch')}</p>`;
      updateBadges();
      return;
    }
    const btn = $('#planBtn');
    btn.disabled = true;
    $('#status').textContent = Tx('stPlanning');
    const myRun = runId + 1;
    try {
      const res = await runPlan(buildConfig());
      if (myRun !== runId) return;
      lastResult = res; selected = -1;
      renderResults(res);
      $('#status').textContent = '';
    } catch (e) {
      $('#status').textContent = Tx('stFailed', { msg: e.message });
    } finally {
      if (myRun === runId) btn.disabled = false;
      updateBadges();
    }
  }

  // ---------- results ----------
  function dots(v) { let s = ''; for (let k = 0; k < 4; k++) s += `<i class="${k < v ? 'on' : ''}"></i>`; return s; }
  function detailHTML(res) {
    if (selected < 0) return `<p class="hint">${T('tapPlant')}</p>`;
    const p = res.plants.find((x) => x.slot === selected);
    if (!p) return '';
    const rows = [
      [T('rSeason'), p.season, p.season ? T('whySeason', { n: p.season }) : T('whySeasonOk')],
      [T('rNutrients'), p.nutrient, p.nutrient ? T('whyNut', { n: p.nutrient }) : T('whyNutOk')],
      [T('rFamily'), p.family, p.family ? T('whyFam') : T('whyFamOk')],
    ];
    let care = '';
    if (p.care) care = `<div class="srow"><span>${T('rCare')}</span><span>+${p.care}</span><span>${T('whyCare')}</span></div>`;
    return `<div class="detail-card">${cropPic(p.ci, 'big-ic')}<div>
      <b>${esc(cropName(p.ci))}</b> <span class="muted">${T('fromSeed', { seed: seedName(p.ci), t: letter(p.tile) })}</span>
      <div class="stress">${rows.map(([k, v, why]) => `<div class="srow"><span>${k}</span><span class="dots" aria-label="${esc(Tx('ofFour', { n: v }))}">${dots(v)}</span><span>${why}</span></div>`).join('')}${care}</div>
      <p class="outcome">${T('outcome', { s: p.stress, n: p.seeds })}${p.giant ? ' ' + T('outcomeGiant') : ''}</p>
      ${p.season ? `<p class="hint">${T('offPart')}</p>` : ''}</div></div>`;
  }
  function highlight(res) {
    const g = res.geometry;
    const ci = selected >= 0 ? res.grid[selected] : -1;
    const r0 = Math.floor(selected / g.cols), c0 = selected % g.cols;
    $$('.slot.plant').forEach((el) => {
      const i = Number(el.dataset.slot);
      el.classList.toggle('sel', i === selected);
      let kin = false;
      if (selected >= 0 && i !== selected && res.grid[i] === ci) {
        const r = Math.floor(i / g.cols), c = i % g.cols;
        kin = (r - r0) * (r - r0) + (c - c0) * (c - c0) <= 9 + 1e-6;
      }
      el.classList.toggle('kin', kin);
    });
  }

  function renderResults(res) {
    const g = res.geometry, Tt = res.totals;
    let h = '';
    h += `<div class="summary">
      <div class="big">${use('i-basket')}<b>${Tt.crops}</b><span>${T('sumCrops', { n: Tt.crops })}</span></div>
      <div class="big">${seedPic(0)}<b>${Tt.seeds}</b><span>${T('sumSeeds', { n: Tt.seeds })}</span></div>
      <div class="big"><b>${Tt.netSeeds >= 0 ? '+' : ''}${Tt.netSeeds}</b><span>${T('sumNet')}</span></div>
      <div class="big"><b>${Tt.giants}</b><span>${T('sumGiant')}</span></div>
    </div>`;

    let k = 0;
    h += `<div class="field-row"><div class="board-wrap"><div class="board" style="grid-template-columns:repeat(${g.W},minmax(0,1fr));--board-max:${g.W * 215}px">`;
    for (let tr = 0; tr < g.H; tr++) for (let tc = 0; tc < g.W; tc++) {
      const t = tr * g.W + tc;
      h += `<div class="tile"><span class="tile-name">${letter(t)}</span>`;
      for (let r = 0; r < 3; r++) for (let c = 0; c < 3; c++) {
        const i = (tr * 3 + r) * g.cols + tc * 3 + c;
        const ci = res.grid[i];
        if (ci < 0) h += '<span class="slot" aria-hidden="true"></span>';
        else h += `<button type="button" class="slot plant" data-slot="${i}" style="--d:${(k++) * 18}ms" aria-label="${esc(Tx('plantAria', { crop: cropName(ci), t: letter(t) }))}">${cropPic(ci)}</button>`;
      }
      h += '</div>';
    }
    h += '</div></div>' + weedWatchHTML() + '</div>';
    h += `<div class="detail" id="detail">${detailHTML(res)}</div>`;

    h += `<h3>${T('hSoilAfter')}</h3><div class="tiles">`;
    res.tiles.forEach((t) => {
      const mix = t.counts.map((q, ci) => (q ? `<span class="mix" title="${esc(cropName(ci))}">${cropPic(ci)}×${q}</span>` : '')).join('') || `<span class="muted">${T('empty')}</span>`;
      const bars = NUT.map((n, q) => {
        const s = t.start[q], e = t.end[q];
        return `<div class="bar-row" title="${esc(Tx('barTitle', { nut: G(n.name), a: Math.round(s), b: Math.round(e) }))}">${use('n-' + n.id, 'nut-ic')}<div class="bar"><i class="fill n-${n.id}" style="width:${clamp(e, 0, 100)}%"></i><i class="was" style="left:${clamp(s, 0, 100)}%"></i></div><span>${Math.round(s)} → ${Math.round(e)}</span></div>`;
      }).join('');
      let status = t.balanced ? `<span class="pill good">${T('feedsItself')}</span>` : `<span class="pill warn">${T('outOfBalance')}</span>`;
      let advice = '';
      if (t.lowest) {
        status += `<span class="pill warn">${T('dips')}</span>`;
        advice += `<p class="advice">${T('dipAdvice', { nut: G(NUT[t.lowest.q].name), v: Math.round(t.lowest.value), d: t.lowest.day, r: t.lowest.recoversDay })}</p>`;
      }
      if (!t.balanced) {
        const ch = t.change.map((x, q) => (Math.abs(x) >= 0.5 ? `${G(NUT[q].name)} ${x > 0 ? '+' : '−'}${Math.abs(Math.round(x))}` : null)).filter(Boolean).join(', ');
        advice += `<p class="advice">${T('changeLine', { list: ch })}</p>`;
        t.advice.forEach((a) => {
          const opts = a.items.length ? list(a.items.map((it) => `${G(it.name)} ×${it.count}`)) : Tx('noFert');
          advice += `<p class="advice">${T('addBefore', { n: a.deficit, nut: G(NUT[a.q].name), list: opts })}</p>`;
        });
      }
      h += `<div class="tile-card"><div class="tc-head"><b>${T('tileN', { t: letter(t.index) })}</b>${status}</div><div class="mix-row">${mix}</div>${bars}${advice}</div>`;
    });
    h += '</div>';

    h += `<h3>${T('hSeasonCheck')}</h3><ul class="check">`;
    res.seasonCheck.forEach((s) => {
      const extra = s.level === 'good' ? T('readyAbout', { d: s.readyDay }) : (s.nextGoodDay ? T('fullyFrom', { d: s.nextGoodDay }) : '');
      h += `<li>${cropPic(s.ci)}<b>${esc(cropName(s.ci))}</b><span class="pill ${s.level}">${esc(statusText(s))}</span><span class="muted">${extra}</span></li>`;
    });
    h += '</ul>';

    const maxY = Math.max(1, ...res.scan.map((s) => s.yld));
    h += `<h3>${T('hLater')}</h3>`;
    h += `<div class="later" role="img" aria-label="${esc(Tx('laterAria'))}">` + res.scan.map((s) =>
      `<div class="later-col${s.yld === maxY ? ' best' : ''}" title="${esc(Tx('laterTitle', { d: s.day, y: s.yld, p: s.plants }))}"><b>${s.yld}</b><i class="s-${SEASON_ID[s.season]}" style="height:${Math.max(4, (s.yld / maxY) * 82)}%"></i></div>`).join('') + '</div>';
    h += '<div class="later-labels">' + res.scan.map((s, i) => `<span>${i === 0 ? T('today') : T('dayN', { d: s.day })}</span>`).join('') + '</div>';

    if (res.leftovers.length) {
      h += `<h3>${T('hLeft')}</h3><p class="hint" style="margin:0 0 8px">${T(state.soilRule === 'every' ? 'leftEvery' : 'leftBalanced')}</p><div class="leftover">` + res.leftovers.map((l) =>
        `<span>${cropPic(l.ci)}${esc(cropName(l.ci))} ×${l.left}${l.offSeason && l.nextGoodDay ? T('plantFrom', { d: l.nextGoodDay }) : ''}</span>`).join('') + '</div>';
    }
    const sg = res.seedsToGet;
    if (sg && sg.add.length) {
      h += `<h3>${T('hToGet')}</h3><p class="hint" style="margin:0 0 8px">${T('toGetNote', { a: sg.cropsAndSeedsAfter, b: Tt.crops + Tt.seeds })}</p><div class="leftover">` +
        sg.add.map((a) => `<span>${seedPic(a.ci)}${esc(seedName(a.ci))} (${esc(cropName(a.ci))}) ×${a.count}</span>`).join('') + '</div>';
    } else if (sg && sg.reason === 'no-room') {
      h += `<p class="hint">${T('noRoom')}</p>`;
    }
    $('#results').innerHTML = h;
    updateBadges();
  }

  // ---------- events ----------
  function onDayChange() { save(); renderDay(); renderPouch(); schedulePlan(); }
  document.addEventListener('click', (e) => {
    const t = e.target.closest('button');
    if (!t) return;
    if (t.dataset.go) { setView(t.dataset.go, true); return; }
    if (t.dataset.season != null) { state.startSeason = Number(t.dataset.season); onDayChange(); return; }
    if (t.dataset.step) {
      const by = Number(t.dataset.by);
      if (t.dataset.step === 'day') { state.day = clamp(state.day + by, 1, 9999); onDayChange(); }
      else {
        state[t.dataset.step] = clamp(state[t.dataset.step] + by, 1, 4);
        save(); renderFarm(); schedulePlan();
      }
      return;
    }
    if (t.dataset.add != null) { const ci = Number(t.dataset.add); setSeed(ci, (state.seeds[CROPS[ci].name] || 0) + 1); return; }
    if (t.dataset.sub != null) { const ci = Number(t.dataset.sub); setSeed(ci, (state.seeds[CROPS[ci].name] || 0) - 1); return; }
    if (t.dataset.weed) { openWeed(t.dataset.weed); return; }
    if (t.id === 'weedClose') { closeWeed(); return; }
    if (t.dataset.rule != null) { state.soilRule = t.dataset.rule; save(); renderFarm(); schedulePlan(); return; }
    if (t.dataset.off != null) { state.offSeason = t.dataset.off; save(); renderFarm(); schedulePlan(); return; }
    if (t.dataset.fert != null) {
      const f = t.dataset.fert;
      state.ferts = state.ferts.includes(f) ? state.ferts.filter((x) => x !== f) : state.ferts.concat(f);
      t.setAttribute('aria-pressed', String(state.ferts.includes(f)));
      save(); schedulePlan(); return;
    }
    if (t.dataset.slot != null && lastResult) {
      const i = Number(t.dataset.slot);
      selected = selected === i ? -1 : i;
      $('#detail').innerHTML = detailHTML(lastResult);
      highlight(lastResult);
      return;
    }
    if (t.id === 'clearSeeds') {
      state.seeds = {}; state.example = false; save();
      CROPS.forEach((_, ci) => updateSeedCard(ci)); plan(); return;
    }
    if (t.id === 'planBtn') plan();
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.id === 'langSel') { setLang(t.value); return; }
    if (t.id === 'day') { state.day = clamp(Math.floor(Number(t.value) || 1), 1, 9999); onDayChange(); }
    else if (t.id === 'daysLeft') { state.daysLeft = t.value === '' ? '' : String(clamp(Math.floor(Number(t.value) || 1), 1, 99)); onDayChange(); }
    else if (t.dataset.len != null) { state.lengths[Number(t.dataset.len)] = clamp(Math.floor(Number(t.value) || 1), 1, 99); onDayChange(); }
    else if (t.dataset.qty != null) setSeed(Number(t.dataset.qty), t.value);
    else if (t.id === 'W' || t.id === 'H') { state[t.id] = clamp(Math.floor(Number(t.value) || 1), 1, 4); save(); renderFarm(); schedulePlan(); }
    else if (t.id === 'water' || t.id === 'attend') { state[t.id] = t.checked; save(); schedulePlan(); }
    else if (t.name === 'soil') { state.soil = t.value; save(); renderHat(); schedulePlan(); }
    else if (t.dataset.jar) {
      const [tile, q] = t.dataset.jar.split(':').map(Number);
      const j = (state.jars[tile] || [20, 20, 20]).slice();
      j[q] = clamp(Math.floor(Number(t.value) || 0), 0, 100);
      state.jars[tile] = j; save(); schedulePlan();
    }
  });

  $('#weedBox').addEventListener('click', (e) => { if (e.target.id === 'weedBox') closeWeed(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('#weedBox').hidden) closeWeed(); });

  $('#langSel').innerHTML = LANGS.map((c) => `<option value="${c}" lang="${c}">${esc(I18N[c]._name)}</option>`).join('');
  lang = pickLang(state.lang);
  $('#langSel').value = lang;
  setView(state.view, false);
  setLang(lang);
  plan();
})();

</script>
</body>
</html>
